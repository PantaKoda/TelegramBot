[project]
name = "telegrambot"
version = "0.1.0"
description = "Private Telegram bot for filing schedule screenshots in Cloudflare R2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.93",
    "pytelegrambotapi>=4.36.1",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
]

[project.scripts]
telegrambot = "telegrambot.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.93",
]
